# ----------------------------------------------------------------------------
# TOOL VERSIONS
# ----------------------------------------------------------------------------
[tools]
python = "3.12"
uv = "0.11.14"

# ----------------------------------------------------------------------------
# ENVIRONMENT
# ----------------------------------------------------------------------------
[env]
# Auto-create and activate venv
_.python.venv = ".venv"

# ----------------------------------------------------------------------------
# TASKS
# ----------------------------------------------------------------------------

[tasks.env-create]
description = "Create development environment"
run = ["uv sync"]

[tasks.env-rm]
description = "Remove development environment"
run = ["rm -rf .venv"]

[tasks.env-show]
description = "Show python and uv locations (for IDE settings)"
run = [
  'echo "Python:  $(which python)"',
  'echo "uv:      $(which uv)"',
]

[tasks.test]
description = "Run unit + integration tests (no Docker)"
run = ["PYTHONPATH=src python -m unittest discover -s src/alcatrazer/tests -v"]

[tasks.test-smoke]
description = "Run Docker smoke tests (requires initialized environment + built image)"
run = ["PYTHONPATH=src python -m unittest src/alcatrazer/integration_tests/test_smoke.py -v"]

[tasks.test-integration]
description = "Run Docker integration tests (requires initialized environment + built image)"
run = ["PYTHONPATH=src python -m unittest discover -s src/alcatrazer/integration_tests -v"]

[tasks.lint]
description = "Run linter"
# Scope ruff to our code (src/ — which holds both the package and its
# tests at src/alcatrazer/tests/, since tests ship with the wheel as
# `alcatrazer test` validation for end users). Anything outside src/
# (build artifacts, AI-tool scaffolding installed in the tree, etc.)
# isn't ours to lint.
run = ["ruff check src"]

[tasks.format]
description = "Format code"
run = ["ruff format src", "ruff check --fix src"]

[tasks.build]
description = "Build PyPI package"
run = ["uv build"]
