[project]
name = "alcatrazer"
dynamic = ["version"]
description = "Secure AI agent workspace — your code gets out, your secrets don't"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Grzegorz Latuszek", email = "latuszek.grzegorz@gmail.com"},
]
keywords = ["ai", "agents", "docker", "security", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/greg-latuszek/alcatrazer"
Repository = "https://github.com/greg-latuszek/alcatrazer"
Issues = "https://github.com/greg-latuszek/alcatrazer/issues"

[project.scripts]
alcatrazer = "alcatrazer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/alcatrazer/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/alcatrazer/"]

[tool.hatch.build.targets.wheel]
packages = ["src/alcatrazer"]


# --- Development dependencies ---

[dependency-groups]
dev = [
    "ruff>=0.9",
    "build>=1.0",
    "twine>=6.0",
]

# --- Tool configuration ---

[tool.uv]
required-version = ">=0.11.5"
# "exclude-newer" sets a dependency cooldown for packages to mitigate potential supply-chain attacks. #
# The setting can be overridden for a package on a one-off basis by running the following command:    #
#   uv lock --upgrade-package $PACKAGE --exclude-newer-package $PACKAGE="0 days"                      #
# see: https://blog.yossarian.net/2025/11/21/We-should-all-be-using-dependency-cooldowns
exclude-newer = "7 days"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "RUF",  # ruff
]
ignore = [
    "UP036",  # version guard blocks — we keep these for friendly errors when run directly with old Python
]
