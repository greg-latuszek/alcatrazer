name: Smoke Tests

# Docker integration tests — run on merge to main only.
# Verifies container isolation properties on a clean machine.

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure git for CI
        # `_first_time_setup` reads user.name/email from git config as the
        # default promotion identity; give CI a deterministic one even
        # though the smoke test stubs ask_promotion_identity.
        run: |
          git config --global user.name "CI Test"
          git config --global user.email "ci@test.local"
          git config --global init.defaultBranch main

      - name: Install alcatrazer (editable)
        # Makes `from alcatrazer import …` work inside the smoke test's
        # tempdir-based test project, without path hacks.
        run: pip install -e .

      - name: Run smoke tests
        # setUpClass creates a fresh tempdir project and drives
        # alcatrazer.start._first_time_setup end-to-end: generate recipe
        # -> docker build -> docker run -> run commands via docker exec.
        # tearDownClass stops + removes the container.
        run: python -m unittest discover -s src/alcatrazer/integration_tests -v