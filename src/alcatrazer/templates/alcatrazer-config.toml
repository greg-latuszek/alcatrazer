# Alcatrazer per-developer configuration.
# Lives at .alcatrazer/config.toml in the target repository.
# Gitignored via .git/info/exclude — never enters the agent workspace.

# File-format version. Bumped when the structure of this file changes
# in an incompatible way (see src/alcatrazer/schemas.json for history).
# Older tooling refuses newer schemas rather than silently misreading;
# v0.1.0 had no schema_version field at all — v0.1.1 introduced it.
schema_version = 2

# Path to the coding environment definition, relative to repo root.
coding_environment_file = "coding-environment.toml"

[promotion]
# Identity used when promoting commits from the workspace to the outer repo.
# Priority chain (lowest to highest):
#   git config (local > global) < this file < CLI --author-name/--author-email
name = "Your Name"
email = "your@email.com"

[promotion-daemon]
# Polling interval in seconds.
interval = 5

# Logging verbosity: "normal" or "detailed".
verbosity = "normal"

# Maximum log file size before rotation (in KB).
max_log_size = 512